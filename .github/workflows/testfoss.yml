name: Testfoss WebGL2 demo

on:
  push:
    branches: [testfoss-demo]
  pull_request:
    branches: [testfoss-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgl2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Set up Rust Wasm target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@132c875eef0d3e3be95c2d08d74e8559cbf74bdb # v2.62.55
        with:
          tool: wasm-pack@0.15.1

      - name: Install browser tooling
        run: |
          npm install -g @lmctl-ai/lmctl@0.2.469
          npm ci --prefix testfoss
          testfoss/node_modules/.bin/playwright install --with-deps chromium

      - name: Build official WebGL2 demo
        run: ./testfoss/build.sh

      - name: Run official headless Chrome WebGL test
        run: ./testfoss/test.sh

      - name: Check WebGL2 scenes through lmwebtest
        run: ./testfoss/browser.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testfoss-vello-webgl2-browser
          path: testfoss/results/
          if-no-files-found: warn
